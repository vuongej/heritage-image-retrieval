# Web demo đầy đủ: docker compose up -d --build  ->  http://localhost:8080
#
#   web        SPA + Caddy, proxy /api (gắn X-API-Key phía server)            :8080
#   api        Pipeline B — truy xuất (FastAPI, NumPy, không torch)             :8000
#   processor  Pipeline A — upload CSV, lọc/kiểm duyệt ảnh (SigLIP2+LightGBM)   :8100
#
# Hai pipeline là hai service, hai image độc lập: tắt / lỗi processor không ảnh hưởng tìm kiếm.
# Index của api: ./data/local (catalog.sqlite3, vectors.npy, index.json, kg/) — tạo theo README §3
# hoặc kéo từ HF dataset khi đặt HF_DATASET + HF_TOKEN trong .env; lần đầu được chép vào volume apidata.
name: heritage-image-retrieval

services:
  api:
    build: {context: ., dockerfile: deploy/backend.Dockerfile}
    env_file: [.env]
    environment:
      LOCAL_DATA_DIR: /home/user/data
      VECTOR_BACKEND: numpy
      RERANK_BACKEND: ${RERANK_BACKEND_DOCKER:-api}
    volumes:
      # Index nằm trên volume (file system Linux) — SQLite WAL không ổn định trên bind mount
      # Windows/macOS. ./data/local chỉ là nguồn read-only, start.sh chép file mới hơn vào.
      - apidata:/home/user/data
      - ./data/local:/home/user/seed:ro
    ports: ["8000:8000"]
    restart: unless-stopped

  processor:
    build: {context: ., dockerfile: deploy/processor.Dockerfile}
    env_file: [.env]
    environment:
      PROCESS_DIR: /home/user/work/process
      LOCAL_DATA_DIR: /home/user/work/state
    volumes:
      - processdata:/home/user/work
    ports: ["8100:8100"]
    restart: unless-stopped

  web:
    build: {context: ., dockerfile: deploy/web.Dockerfile}
    environment:
      TEST_API_KEY: ${TEST_API_KEY:-gsk_test_dev_only}
    ports: ["8080:80"]
    depends_on:
      api: {condition: service_healthy}
      processor: {condition: service_started}
    restart: unless-stopped

  # Load test tái lập được: docker compose --profile loadtest run --rm k6
  k6:
    image: grafana/k6:1.3.0
    profiles: ["loadtest"]
    environment:
      API_BASE: http://web/api
      PROFILE: ${K6_PROFILE:-standard}
      SLO_P95_MS: "3000"
      SUMMARY_PATH: /reports/raw.json
    volumes:
      - ./loadtest:/scripts:ro
      - ./reports/loadtest:/reports
    command: ["run", "/scripts/loadtest.js"]
    depends_on:
      web: {condition: service_healthy}

volumes:
  apidata:
  processdata:
