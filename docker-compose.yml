name: heritage-image-retrieval

x-api-env: &api-env
  LLM_PROVIDER: ${LLM_PROVIDER:-none}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
  LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://ollama:11434}
  LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen3.5:2b}
  LOCAL_VLM_MODEL: ${LOCAL_VLM_MODEL:-qwen3-vl:4b}
  EMBED_MODEL: ${EMBED_MODEL:-siglip2-base-patch16-384}
  EMBED_DIM: ${EMBED_DIM:-1152}
  RERANK_TOP_K: ${RERANK_TOP_K:-100}
  RERANK_KEEP: ${RERANK_KEEP:-10}
  POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://app:app@postgres:5432/heritage}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  QDRANT_URL: http://qdrant:6333  # trong mạng compose; .env QDRANT_URL dành cho chạy local
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_BUCKET: ${S3_BUCKET:-heritage-images}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
  API_KEY_ENFORCE: ${API_KEY_ENFORCE:-true}
  API_KEY_SALT: ${API_KEY_SALT:-dev-salt-change-me}
  TEST_API_KEY: ${TEST_API_KEY:-gsk_test_dev_only}
  SLO_P95_MS: ${SLO_P95_MS:-1500}

services:
  api:
    build: {context: ., dockerfile: Dockerfile.api}
    env_file: [.env]
    environment: *api-env
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/v1/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build: {context: ., dockerfile: Dockerfile.worker}
    env_file: [.env]
    environment: *api-env
    command: ["python", "-m", "pipeline.worker_loop"]
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  web:
    build: {context: ., dockerfile: Dockerfile.web}
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    ports: ["3000:3000"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: heritage
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d heritage"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    volumes: [qddata:/qdrant/storage]
    ports: ["${QDRANT_HOST_PORT:-6333}:6333"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]

  ollama:
    image: ollama/ollama:latest
    profiles: ["local"]
    volumes: [ollamadata:/root/.ollama]
    ports: ["11434:11434"]

  k6:
    image: grafana/k6:latest
    profiles: ["loadtest"]
    environment:
      API_BASE: http://api:8000
      TEST_API_KEY: ${TEST_API_KEY:-gsk_test_dev_only}
    volumes:
      - ./loadtest:/scripts:ro
      - ./reports:/reports
    entrypoint: ["k6"]
    depends_on:
      api: {condition: service_healthy}

volumes:
  pgdata:
  qddata:
  miniodata:
  ollamadata:
